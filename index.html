<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskClaw</title>
<meta name="description" content="AskClaw：做可核验的 AI 评测与工具。旗舰项目 AMBER——琥珀式封存的历史回放评测。">
<style>
  :root { --ink:#17242b; --sub:#5a6b73; --teal:#00a5b5; --teal-dark:#0b7c88; --bg:#fafdfe; --card:#fff; --line:#e3ecef; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.7; }
  a { color: var(--teal-dark); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  header { border-bottom: 1px solid var(--line); padding: 18px 0; }
  header .wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-weight: 800; font-size: 20px; color: var(--ink); }
  .logo span { color: var(--teal); }
  nav a { margin-left: 18px; font-size: 14px; color: var(--sub); }
  .hero { padding: 72px 0 48px; }
  .hero h1 { font-size: 42px; line-height: 1.3; }
  .hero h1 em { font-style: normal; color: var(--teal); }
  .hero p.lead { margin-top: 16px; font-size: 18px; color: var(--sub); max-width: 680px; }
  section { padding: 32px 0; }
  h2 { font-size: 22px; margin-bottom: 14px; }
  .proj { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; display: block; color: var(--ink); }
  .proj:hover { border-color: var(--teal); text-decoration: none; box-shadow: 0 2px 14px rgba(0,165,181,.08); }
  .proj .tag { font-size: 12.5px; color: var(--teal-dark); font-weight: 700; letter-spacing: 1px; }
  .proj h3 { font-size: 26px; margin: 6px 0 8px; }
  .proj p { color: var(--sub); font-size: 15px; max-width: 640px; }
  .proj img { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 16px; background:#fff; }
  .proj .more { display: inline-block; margin-top: 14px; font-weight: 600; color: var(--teal-dark); }
  .soon { color: var(--sub); font-size: 14.5px; border: 1px dashed var(--line); border-radius: 14px; padding: 22px 28px; }
  footer { border-top: 1px solid var(--line); margin-top: 40px; padding: 26px 0 40px; color: var(--sub); font-size: 13.5px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">Ask<span>Claw</span></div>
    <nav>
      <a href="https://github.com/getaskclaw">GitHub</a>
      <a href="en.html">English</a>
    </nav>
  </div>
</header>

<div class="wrap">

<section class="hero">
  <h1>Ask<em>Claw</em></h1>
  <p class="lead">我们做可核验的 AI 评测与工具：说的每一句「它行」，都要拿得出证据。</p>
</section>

<section>
  <h2>项目</h2>
  <a class="proj" href="amber/">
    <div class="tag">旗舰 · 每周更新</div>
    <h3>AMBER — 琥珀式封存的历史回放评测</h3>
    <p>把真实、可审计的历史事件封进琥珀，让 AI 只用当时可得的信息重做一遍。私有题库、公开成绩、公开哈希索引——题目永不公开，分数永远可查。当前 23 案 / 11 个成绩仓。</p>
    <img src="assets/top5-card.png" width="1200" height="931" alt="AMBER 当前总榜">
    <span class="more">进入 AMBER 主页 →</span>
  </a>
  <p class="soon" style="margin-top:16px">更多项目在路上。</p>
</section>

</div>

<footer>
  <div class="wrap">
    AskClaw · <a href="https://github.com/getaskclaw">github.com/getaskclaw</a>
  </div>
</footer>

</body>
</html>
